<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solent Marks</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="buoys.js"></script>
  <style>
    .arrow-marker-wrapper {
      position: relative;
      width: 40px;
      height: 40px;
    }

    .arrow-marker {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%) rotate(0deg);
      transform-origin: center;
      background-image: url('data:image/svg+xml;utf8,<svg fill="yellow" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="50,0 100,100 50,80 0,100"/></svg>');
      background-size: contain;
      background-repeat: no-repeat;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Solent Marks</h2>

    <div class="mb-4">
      <form class="row g-3" id="inputForm" onsubmit="return handleSubmit(event)">
        <div class="mb-3">
          <label for="buoyList" class="form-label fw-light">Marks of the course. (e.g. 73 4L 4C 4L 4B 4L 72)</label>
          <input type="text" class="form-control" id="buoyList">
        </div>
        <div class="row">
          <div class="col-auto">
            <label for="windDirection" class="form-label fw-light">Wind Direction</label>
            <input type="number" class="form-control" id="windDirection" placeholder="Wind direction (°)" min="0"
              max="359" required value="210">
          </div>
          <div class="col-auto">
            <label for="boatSpeed" class="form-label fw-light">VMG</label>
            <input type="number" class="form-control" id="boatSpeed" placeholder="Boat Speed (knots)" min="1" max="20"
              required value="4">
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-auto">
            <button class="btn btn-primary" type="submit">Submit</button>
          </div>
        </div>
      </form>
    </div>
    <div>
      <table class="table table-striped table-hover" id="outputTable" style="display: none;">
        <thead>
          <tr>
            <th>Leg</th>
            <th>Mark Name</th>
            <th>Distance</th>
            <th>Bearing</th>
            <th>Wind Angle</th>
            <th>Time to Mark</th>
          </tr>
        </thead>
        <tbody>
          <!-- Output rows go here -->
        </tbody>
      </table>
    </div>

    <div id="map" style="height:500px;"></div>
    
    <div id="controls">
      <button class="btn btn-primary" id="replayBtn">Play Again</button>
    </div>
  </div>

  <script>
    // Replace with your Mapbox access token
    mapboxgl.accessToken = 'pk.eyJ1Ijoic29sZW50LW1hcmtzIiwiYSI6ImNtY25oY3FmNzAwZnQyaXIxYzNoenoxYXoifQ.uteH9BVoyN1wSO_xcW0Bwg';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v9',
      projection: 'globe', // Display the map as a globe, since satellite-v9 defaults to Mercator
      zoom: 1,
      center: [30, 15]
    });

    const mapCoords = [];


    function handleSubmit(event) {

      event.preventDefault();

      const boatSpeed = parseFloat(document.getElementById('boatSpeed').value.trim());
      const windDir = document.getElementById('windDirection').value.trim();
      const input = document.getElementById('buoyList').value.trim();
      const names = input.toUpperCase().split(/\s+/);

      const buoyMap = {};
      buoys.forEach(b => buoyMap[b.name] = b);




      const tbody = document.getElementById('outputTable').querySelector('tbody');
      tbody.innerHTML = ''; // Clear previous rows

      for (let i = 0; i < names.length - 1; i++) {
        const from = buoyMap[names[i]];

        if (i==0) {
          mapCoords.push([from.longitude, from.latitude]);
        }

        const to = buoyMap[names[i + 1]];
        if (from && to) {
          // Convert distance from km to nautical miles (1 nm = 1.852 km)
          const distanceKm = haversine(from.latitude, from.longitude, to.latitude, to.longitude);
          const distanceNm = (distanceKm / 1.852).toFixed(1);
          const bearing = calculateBearing(from.latitude, from.longitude, to.latitude, to.longitude).toFixed(0);
          const windAngle = smallestSignedAngle(bearing, windDir);
          const timeToMarkInMinutes = (distanceNm / boatSpeed * 60).toFixed(1);
          const row = document.createElement('tr');
          row.innerHTML = `<td>${from.name} → ${to.name}</td><td>${to.desc} (${to.sym})</td><td>${distanceNm} nm</td><td>${bearing}°</td><td>${windAngle}°</td><td>${timeToMarkInMinutes} mins</td>`;
          tbody.appendChild(row);

          mapCoords.push([to.longitude, to.latitude]);

        }
      }
      document.getElementById('outputTable').style.display = '';


      map.addSource('route', {
        'type': 'geojson',
        'data': {
          'type': 'Feature',
          'properties': {},
          'geometry': {
            'type': 'LineString',
            'coordinates': mapCoords
          }
        }
      });

      map.addLayer({
        'id': 'route',
        'type': 'line',
        'source': 'route',
        'layout': {
          'line-join': 'round',
          'line-cap': 'round'
        },
        'paint': {
          'line-color': '#fc0fc0',
          'line-width': 4
        }
      });

      map.jumpTo({
        center: mapCoords[0],
        zoom: 11
      });

      startAnimation();
      return false;
    }

    // Haversine formula to calculate distance (in km)
    function haversine(lat1, lon1, lat2, lon2) {
      const toRad = deg => deg * Math.PI / 180;
      const R = 6371; // Earth radius in km
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // Calculate initial bearing from point 1 to point 2
    function calculateBearing(lat1, lon1, lat2, lon2) {
      const toRad = deg => deg * Math.PI / 180;
      const toDeg = rad => rad * 180 / Math.PI;
      const dLon = toRad(lon2 - lon1);
      const y = Math.sin(dLon) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
        Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
      let brng = Math.atan2(y, x);
      brng = toDeg(brng);
      return (brng + 360) % 360;
    }



    function smallestSignedAngle(from, to) {
      // Bearings in degrees, 0-360
      let diff = ((to - from + 540) % 360) - 180;
      return diff;
    }





    // Create DOM elements
    const wrapper = document.createElement('div');
    wrapper.className = 'arrow-marker-wrapper';

    const arrow = document.createElement('div');
    arrow.className = 'arrow-marker';

    wrapper.appendChild(arrow);



    const marker = new mapboxgl.Marker(wrapper)
      .setLngLat([0, 50])
      .addTo(map);

    let currentSegment = 0;
    let t = 0;
    const speed = 0.02;

    function interpolate(p1, p2, t) {
      const lng = p1[0] + (p2[0] - p1[0]) * t;
      const lat = p1[1] + (p2[1] - p1[1]) * t;
      return [lng, lat];
    }


    function startAnimation() {
      currentSegment = 0;
      t = 0;
      animating = true;
      animate();
    }

    function animate() {
      if (!animating) return;

      if (currentSegment < mapCoords.length - 1) {
        const start = mapCoords[currentSegment];
        const end = mapCoords[currentSegment + 1];
        const pos = interpolate(start, end, t);
        const bearing = calculateBearing(start[1], start[0], end[1], end[0]);

        marker.setLngLat(pos);
        arrow.style.transform = `translate(-50%, -50%) rotate(${bearing}deg)`;

        t += speed;
        if (t >= 1) {
          t = 0;
          currentSegment++;
        }

        requestAnimationFrame(animate);
      } else {
        marker.setLngLat(mapCoords[mapCoords.length - 1]);
        animating = false;
      }
    }

 document.getElementById('replayBtn').addEventListener('click', () => {
    animating = false;
    setTimeout(startAnimation, 100); // small delay to ensure animation resets
  });

  </script>

</body>

</html>
